<!DOCTYPE html>
<html>
<body>
<div style="font-family:system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; margin:12px 0;">
  <a href="index.html">Home</a> · <a href="registry.html">Versioning System</a>
</div>

<textarea id="input" rows="20" cols="80"></textarea>
<button onclick="run()">Hash</button>
<pre id="output"></pre>

<script src="canonical.js"></script>
<script>
async function run() {
  const obj = JSON.parse(document.getElementById("input").value);
  const canonical = canonicalJson(obj);
  const encoder = new TextEncoder();
  const data = encoder.encode(canonical);
  const hashBuffer = await crypto.subtle.digest("SHA-256", data);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  const hashHex = hashArray.map(b => b.toString(16).padStart(2, "0")).join("");
  document.getElementById("output").textContent = hashHex;
}
</script>
</body>
</html>
